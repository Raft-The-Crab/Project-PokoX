name: CI

# Phase 0 gate (systemplan/02, masterplan/23): a clean checkout builds and
# CI runs tests. This workflow only runs on pushes/PRs, which require explicit
# owner authorisation (see CODEBUDDY.md section 1).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        preset: [debug, development, release, server]
    steps:
      - uses: actions/checkout@v4

      # Ninja + MSVC needs the Visual Studio developer environment on PATH.
      - name: Set up MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  lint:
    # Blocking since DEC-004: clang-format 23.1.5 and clang-tidy 23.1.4 are
    # pinned PyPI wheels (see third_party/DEPENDENCIES.md).
    name: Formatting and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned clang tooling
        run: |
          python3 -m venv /tmp/lintenv
          /tmp/lintenv/bin/pip install --quiet \
            clang-format==23.1.5 clang-tidy==23.1.4
          echo "/tmp/lintenv/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        shell: bash
        run: |
          find engine tools tests runtime server examples \
            \( -name '*.h' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Static analysis
        shell: bash
        run: |
          cmake --preset debug
          cmake --build --preset debug
          clang-tidy -p build/debug \
            engine/core/src/poko_version.cpp \
            engine/core/src/poko_log.cpp \
            engine/core/src/poko_assert.cpp

  policy:
    name: Repository policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject obvious secrets in tracked files
        shell: bash
        run: |
          if git grep -n -iE '(BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' -- .; then
            echo "Possible secret committed. See CODEBUDDY.md section 5."
            exit 1
          fi
          echo "No obvious secrets in tracked files."

      - name: Require the four build presets
        shell: bash
        run: |
          for preset in debug development release server; do
            grep -q "\"name\": \"$preset\"" CMakePresets.json || exit 1
          done
          echo "All four configurations declared."
